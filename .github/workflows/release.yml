name: Release

# Builds, signs, notarizes and publishes a release, then updates the
# Homebrew tap. Push a tag `vX.Y.Z` matching the workspace version, or run it
# by hand for an existing tag. Secrets and setup: docs/releasing.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag must match the workspace version
        id: check
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    outputs:
      notarized: ${{ steps.package.outputs.notarized }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Rust toolchain with both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Notarization key
        if: env.APPLE_API_KEY != ''
        run: |
          echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2

      - name: Build, sign, notarize and package
        id: package
        run: |
          # Without a Developer ID the app is ad-hoc signed and not notarized;
          # install.sh re-signs it with a per-machine identity.
          args=(package --universal)
          notarized=false
          if [ -n "$MACOS_SIGNING_IDENTITY" ] && [ -n "$MACOS_CERTIFICATE" ]; then
            args+=(--sign "$MACOS_SIGNING_IDENTITY")
            if [ -n "$APPLE_API_KEY" ]; then
              args+=(--notarize)
              notarized=true
            fi
          else
            echo "::notice::No Developer ID secrets: the macOS build is ad-hoc signed and not notarized."
          fi
          cargo xtask "${args[@]}"
          echo "notarized=$notarized" >> "$GITHUB_OUTPUT"

      - name: Check the signature and Gatekeeper verdict
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_API_KEY != ''
        run: |
          codesign --verify --deep --strict --verbose=2 target/bundle/icygui.app
          spctl --assess --type execute --verbose=4 target/bundle/icygui.app
          xcrun stapler validate target/dist/*.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: target/dist/icygui-*
          if-no-files-found: error

      - name: Remove the signing keychain
        if: always() && env.MACOS_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask package
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            target/dist/icygui-*
            target/dist/icygui_*
          if-no-files-found: error

  publish:
    needs: [version, macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum icygui* | tee SHA256SUMS

      - name: Sign the checksums (GPG)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: dist
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign SHA256SUMS

      - name: Build provenance attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/icygui*

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "icygui ${{ needs.version.outputs.version }}" --generate-notes --verify-tag

  # Optional: only runs once a tap repository and HOMEBREW_TAP_TOKEN exist.
  homebrew:
    needs: [version, macos, publish]
    runs-on: ubuntu-24.04
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'alexykn/homebrew-tap' }}
    steps:
      - name: Skip without a tap token
        if: env.HOMEBREW_TAP_TOKEN == ''
        run: echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated."

      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          ref: ${{ env.TAG }}

      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Update the cask and formula
        if: env.HOMEBREW_TAP_TOKEN != ''
        run: |
          rustup toolchain install
          notarized=()
          if [ "${{ needs.macos.outputs.notarized }}" = true ]; then notarized=(--notarized); fi
          cargo xtask homebrew --dist dist --out tap --repo "$GITHUB_REPOSITORY" "${notarized[@]}"
          cd tap
          git config user.name "icygui release"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "icygui ${{ needs.version.outputs.version }}" || exit 0
          git push

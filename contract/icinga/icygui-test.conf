/* Contract-test fixtures for icygui (loaded by the real Icinga 2 test container). */

object ApiUser "icygui" {
  password = "icygui-test"
  // Least privilege: no filter-expression permission on purpose.
  permissions = [ "objects/query/*", "status/query", "events/*", "actions/*" ]
}

object ApiUser "viewer" {
  password = "viewer-test"
  permissions = [ "objects/query/Host", "objects/query/Service", "status/query", "events/CheckResult", "events/StateChange" ]
}

// The groups are in icygui-groups.conf: a cluster needs them in a global
// zone (demo/docker-compose.yml), since hosts in every zone use them.

template Host "icygui-host" {
  check_command = "dummy"
  vars.dummy_state = 0
  vars.dummy_text = "PING OK - Packet loss = 0%, RTA = 0.42 ms"
  check_interval = 30s
  retry_interval = 10s
  max_check_attempts = 3
}

template Service "icygui-passive" {
  check_command = "dummy"
  enable_active_checks = false
  check_interval = 60s
  retry_interval = 15s
  max_check_attempts = 3
}

object Host "db-prod-03" {
  import "icygui-host"
  address = "10.0.2.13"
  display_name = "db-prod-03"
  groups = [ "databases" ]
  vars.role = "postgres"
  vars.env = "prod"
  vars.pg_cluster = "orders-main"
  notes_url = "https://wiki.example.com/db/db-prod-03"
}

object Host "k8s-node-07" {
  import "icygui-host"
  address = "10.0.4.17"
  groups = [ "kubernetes" ]
  vars.role = "k8s"
}

object Host "k8s-node-11" {
  import "icygui-host"
  address = "10.0.4.31"
  groups = [ "kubernetes" ]
  vars.dummy_state = 2
  vars.dummy_text = "PING CRITICAL - Packet loss = 100%"
}

object Host "behind-node-11" {
  import "icygui-host"
  address = "10.0.4.99"
  vars.dummy_state = 2
  vars.dummy_text = "PING CRITICAL - Packet loss = 100%"
}

object Dependency "behind-node-11-parent" {
  parent_host_name = "k8s-node-11"
  child_host_name = "behind-node-11"
  disable_notifications = true
}

object Service "postgres-replication" {
  import "icygui-passive"
  host_name = "db-prod-03"
  groups = [ "replication" ]
  vars.lag_crit = 300
}

object Service "pg-connections" {
  import "icygui-passive"
  host_name = "db-prod-03"
}

object Service "disk /var" {
  import "icygui-passive"
  host_name = "k8s-node-07"
  groups = [ "storage" ]
}

object Service "load" {
  host_name = "db-prod-03"
  check_command = "dummy"
  vars.dummy_state = 1
  vars.dummy_text = "WARNING - load average 14.2, 12.8, 11.1"
  check_interval = 20s
  retry_interval = 5s
  max_check_attempts = 2
}

object Service "ping4" {
  host_name = "k8s-node-07"
  check_command = "dummy"
  vars.dummy_text = "PING OK - Packet loss = 0%"
  check_interval = 20s
}

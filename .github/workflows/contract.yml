name: Contract

# ic-api against a real Icinga 2 in Docker (contract/run-icinga.sh): the
# attributes, name lists, errors and event stream the client relies on.
# Read-only; nightly, on demand, and for changes to the API client, the
# model it fills, the fixtures or this workflow.

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "crates/ic-api/**"
      - "crates/ic-model/**"
      - "contract/**"
      - "Cargo.lock"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "crates/ic-api/**"
      - "crates/ic-model/**"
      - "contract/**"
      - "Cargo.lock"
      - ".github/workflows/contract.yml"
  workflow_dispatch:
    inputs:
      icinga_tag:
        description: "icinga/icinga2 image tag"
        required: false
        default: "2.15"

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Missing ICYGUI_CONTRACT_* variables fail the tests instead of letting
  # them pass without checking anything.
  ICYGUI_CONTRACT_REQUIRED: "1"

jobs:
  contract:
    name: ic-api against Icinga ${{ inputs.icinga_tag || '2.15' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the contract tests
        run: cargo test -p ic-api --test contract --locked --no-run

      - name: Start Icinga
        env:
          ICINGA_TAG: ${{ inputs.icinga_tag || '2.15' }}
        run: |
          set -euo pipefail
          vars=$(contract/run-icinga.sh "$ICINGA_TAG")
          if ! grep -q '^ICYGUI_CONTRACT_URL=' <<<"$vars"; then
            echo "::error::contract/run-icinga.sh printed no ICYGUI_CONTRACT_URL"
            exit 1
          fi
          admin_password=$(sed -n 's/^ICYGUI_CONTRACT_ADMIN_PASSWORD=//p' <<<"$vars")
          if [ -n "$admin_password" ]; then
            echo "::add-mask::$admin_password"
          fi
          echo "$vars" >> "$GITHUB_ENV"

      - name: Contract tests
        run: cargo test -p ic-api --test contract --locked

      - name: Icinga logs
        if: failure()
        run: docker logs icygui-contract 2>&1 | tail -n 200

      - name: Stop Icinga
        if: always()
        run: |
          docker rm -f icygui-contract >/dev/null 2>&1 || true
          docker volume rm -f icygui-contract-data >/dev/null 2>&1 || true

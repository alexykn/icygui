name: Release

# Builds, signs, notarizes and publishes a release, then updates the
# Homebrew tap. Push a tag `vX.Y.Z` matching the workspace version, or run it
# by hand for an existing tag. Secrets and setup: docs/releasing.md.
#
# Secrets are only in reach of steps that compile nothing: everything is
# built first (build scripts and proc macros of the whole dependency tree
# run there), then signed. Secrets go into step `env`, never job `env`; the
# jobs that use them run in the `release` environment, whose protection
# rules decide who and which refs get them. No build cache: a release is
# built from scratch, and the actions are pinned to commits.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Tag must match the workspace version
        id: check
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    environment: release
    outputs:
      notarized: ${{ steps.secrets.outputs.notarize }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Metal toolchain
        run: xcrun -sdk macosx metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Rust toolchain with both macOS targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Everything that compiles runs here, with no secret in reach.
      - name: Build and bundle (ad-hoc signed, no secrets)
        run: |
          cargo build --locked -p xtask
          target/debug/xtask bundle --release --universal

      - name: Which signing secrets are set
        id: secrets
        env:
          SIGN: ${{ secrets.MACOS_CERTIFICATE != '' && secrets.MACOS_SIGNING_IDENTITY != '' }}
          NOTARY_KEY: ${{ secrets.APPLE_API_KEY != '' }}
        run: |
          notarize=false
          if [ "$SIGN" = true ] && [ "$NOTARY_KEY" = true ]; then notarize=true; fi
          echo "sign=$SIGN" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          if [ "$SIGN" != true ]; then
            echo "::notice::No Developer ID secrets: the macOS build is ad-hoc signed and not notarized."
          fi

      - name: Import the Developer ID certificate
        if: steps.secrets.outputs.sign == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          (umask 077 && echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12")
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # shellcheck disable=SC2046 # one argument per keychain already listed
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Notarization key
        if: steps.secrets.outputs.notarize == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: (umask 077 && echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8")

      # Builds nothing: the xtask binary from the build step packages the
      # bundle it made (`--prebuilt`), re-signed with the Developer ID.
      - name: Sign, notarize and package
        env:
          SIGN: ${{ steps.secrets.outputs.sign }}
          NOTARIZE: ${{ steps.secrets.outputs.notarize }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Without a Developer ID the app stays ad-hoc signed and isn't
          # notarized; install.sh re-signs it with a per-machine identity.
          args=(package --prebuilt --universal)
          if [ "$SIGN" = true ]; then
            args+=(--sign "$MACOS_SIGNING_IDENTITY")
            if [ "$NOTARIZE" = true ]; then
              args+=(--notarize)
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
            fi
          fi
          target/debug/xtask "${args[@]}"

      - name: Remove the signing keychain and the notarization key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi

      - name: Universal binary with the hardened runtime (REL-02)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          app=target/bundle/icygui.app
          lipo "$app/Contents/MacOS/icygui" -verify_arch arm64 x86_64
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | tee codesign.txt
          grep -q '^CodeDirectory .*flags=.*runtime' codesign.txt
          test "$("$app/Contents/MacOS/icygui" --version)" = "icygui $VERSION"
          rm codesign.txt

      - name: Check the signature and Gatekeeper verdict
        if: steps.secrets.outputs.notarize == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 target/bundle/icygui.app
          spctl --assess --type execute --verbose=4 target/bundle/icygui.app
          xcrun stapler validate target/dist/*.dmg

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-macos
          path: target/dist/icygui-*
          if-no-files-found: error

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev \
            libwayland-dev libfontconfig-dev libfreetype-dev
      - run: rustup toolchain install
      - run: cargo xtask package
      - name: Show the packages
        run: |
          for deb in target/dist/*.deb; do dpkg-deb --info "$deb"; dpkg-deb --contents "$deb"; done
          tar -tvzf target/dist/icygui-*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-${{ matrix.arch }}
          path: |
            target/dist/icygui-*
            target/dist/icygui_*
          if-no-files-found: error

  publish:
    needs: [version, macos, linux]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum icygui* | tee SHA256SUMS

      - name: Sign the checksums (GPG)
        working-directory: dist
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY: SHA256SUMS is not signed."
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          (umask 077 && mkdir -p "$GNUPGHOME")
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign SHA256SUMS
          rm -rf "$GNUPGHOME"

      - name: Build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/icygui*

      # Only the release notes, read as text (nothing from the checkout runs).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
          sparse-checkout: packaging/release-notes
          path: source

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A rebuild of an existing tag replaces the release's files.
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=()
            case $VERSION in *-*) prerelease=(--prerelease) ;; esac
            # The tag's notes (packaging/release-notes/<tag>.md) if written,
            # else GitHub's list of merged pull requests.
            notes=(--generate-notes)
            if [ -f "source/packaging/release-notes/$TAG.md" ]; then
              notes=(--notes-file "source/packaging/release-notes/$TAG.md")
            fi
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "icygui $VERSION" "${notes[@]}" --verify-tag "${prerelease[@]}"
          fi

  # Optional: only runs once a tap repository and HOMEBREW_TAP_TOKEN exist.
  homebrew:
    needs: [version, macos, publish]
    # Prereleases (versions like 0.2.0-rc.1) don't update the tap.
    if: ${{ !contains(needs.version.outputs.version, '-') }}
    runs-on: ubuntu-24.04
    environment: release
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO || 'alexykn/homebrew-tap' }}
    steps:
      - name: Is there a tap token
        id: tap
        env:
          HAS_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          echo "enabled=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [ "$HAS_TOKEN" != true ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; the Homebrew tap was not updated."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.enabled == 'true'
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      # Compiled before the tap token is on disk (the tap checkout keeps it
      # in tap/.git/config for the push).
      - name: Build xtask
        if: steps.tap.outputs.enabled == 'true'
        run: |
          rustup toolchain install
          cargo build --locked -p xtask

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.tap.outputs.enabled == 'true'
        with:
          repository: ${{ env.HOMEBREW_TAP_REPO }}
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.tap.outputs.enabled == 'true'
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Update the cask and formula
        if: steps.tap.outputs.enabled == 'true'
        env:
          NOTARIZED: ${{ needs.macos.outputs.notarized }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          if [ "$NOTARIZED" = true ]; then flags=(--notarized); fi
          target/debug/xtask homebrew --dist dist --out tap --repo "$GITHUB_REPOSITORY" "${flags[@]}"
          cd tap
          git config user.name "icygui release"
          git config user.email "noreply@github.com"
          git add -A
          git commit -m "icygui $VERSION" || exit 0
          git push
